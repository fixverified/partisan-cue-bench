  lean: right
  text: Exempts businesses with fewer than 25 employees and religious objections from federal anti-discrimination rules on wedding services.
  original_text: Exempts businesses with under 25 employees and religious objections from federal anti-discrimination rules on wedding services, letting those owners decline such work and requiring some same-sex couples to find other vendors.
