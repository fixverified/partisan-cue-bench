  lean: left
  text: Creates a federal commission to recommend compensation for families denied federally backed home loans under 20th-century racial lending rules and requires separate funding for any later payments.
  original_text: Creates a $50 million federal commission to recommend compensation for families denied federally backed home loans under 20th-century racial lending rules, with any later payments requiring separate funding of unspecified size.
