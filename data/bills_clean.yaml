  text: Creates a federally capitalized infrastructure bank with $50 billion to lend for public works.
  original_text: Creates a federally capitalized infrastructure bank with $50 billion to lend for public works, leaving taxpayers liable for defaults and shifting some selection decisions away from Congress.
- id: inf_passenger_rail
  topic: infrastructure
  lean: left
  text: Provides $10 billion annually for intercity passenger rail in 10 corridors and requires fares to cover at least 60 percent of operating costs, with federal funds covering the remainder.
  original_text: Provides $10 billion a year for intercity passenger rail in 10 corridors, requiring fares to cover at least 60 percent of operating costs, with federal funds covering the rest.
