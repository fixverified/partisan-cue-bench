# lean = which US party would more often propose the bill, judged from typical party platforms and voting patterns; mixed = no clear party expectation or an unusual cross-party coalition. Not a judgment of merit.
# topic, lean and mirror_of are for analysis only. Dollar, count and percent figures are invented parts of each hypothetical proposal, not sourced projections.

# economics
- {id: econ_min_wage_index, topic: economics, lean: left, text: "Raises the federal minimum wage to $13.50 over four years and indexes it to inflation, raising pay for about 15 million low-wage workers and raising payroll costs for their employers."}
- {id: econ_min_wage_hold, topic: economics, lean: right, text: "Holds the federal minimum wage at its current level for eight years with no inflation adjustment, holding payroll costs for employers and holding the pay floor for about 15 million low-wage workers.", mirror_of: econ_min_wage_index}
- {id: econ_union_private_ballot, topic: economics, lean: right, text: "Requires a federally supervised private-ballot election before any union is recognized, even when most workers have signed cards, adding an election period of about 40 days during which employers may campaign against the union."}
- {id: econ_union_card_recognition, topic: economics, lean: left, text: "Requires employers to recognize a union once most workers have signed authorization cards, with no private-ballot election, removing an election period of about 40 days and leaving workers' choices visible to organizers and coworkers.", mirror_of: econ_union_private_ballot}
- {id: econ_overtime_threshold, topic: economics, lean: left, text: "Sets the salary below which workers must receive overtime pay at 150 percent of each state's median full-time wage, updated yearly, extending overtime to about 3 million more workers and raising employers' payroll costs."}
- {id: econ_merger_burden, topic: economics, lean: left, text: "Requires companies in mergers above $1 billion to prove the deal will not reduce competition, shifting the burden of proof from regulators to those companies and adding six months to the review period."}
- {id: econ_noncompete_limit, topic: economics, lean: left, text: "Bans noncompete agreements for workers earning under $90,000, letting those workers join competitors and leaving employers with trade-secret lawsuits as their main remedy when trained staff leave."}
- {id: econ_loan_rate_cap, topic: economics, lean: left, text: "Caps interest on consumer loans at 30 percent a year, lowering rates for current high-rate borrowers and barring lenders from offering loans above that rate to people with low credit scores."}
- {id: econ_rule_expiry, topic: economics, lean: right, text: "Makes every major new federal regulation expire after ten years unless an agency completes a review and renews it, adding about $500 million a year in review costs and ending rules that businesses plan around if not renewed."}
- {id: econ_midsize_bank_threshold, topic: economics, lean: right, text: "Raises the asset level for enhanced federal bank supervision from $100 billion to $300 billion, lowering compliance costs for midsize banks and removing about 20 institutions from annual stress tests."}
- {id: econ_app_worker_status, topic: economics, lean: right, text: "Lets app-based companies classify drivers and couriers as independent contractors under federal law, with those workers setting their own schedules and falling outside minimum wage, overtime and employer payroll tax contributions."}
- {id: econ_spending_growth_cap, topic: economics, lean: right, text: "Caps growth in annual non-defense discretionary spending at 1 percent for ten years, reducing planned spending by about $800 billion and requiring cuts to research, housing and transportation programs."}
- {id: econ_license_reciprocity, topic: economics, lean: mixed, text: "Requires states to honor occupational licenses issued by other states or lose 5 percent of federal workforce grants, letting licensed workers move without relicensing and overriding some state training standards."}
- {id: econ_central_bank_audit, topic: economics, lean: mixed, text: "Requires an annual congressional audit of the central bank's interest-rate decisions, adding congressional review and reducing the central bank's independence from elected officials on monetary policy."}
- {id: econ_machinery_tariff, topic: economics, lean: mixed, text: "Imposes a 12 percent tariff on imported industrial machinery for five years, raising the price of imports that compete with domestic toolmakers and raising equipment costs for U.S. factories that buy those machines."}

# taxes
- {id: tax_estate_exempt_lower, topic: taxes, lean: left, text: "Lowers the estate tax exemption to $5 million per person, raising about $30 billion a year and requiring more estates, including farms and businesses, to pay the tax or plan around it."}
- {id: tax_estate_exempt_raise, topic: taxes, lean: right, text: "Raises the estate tax exemption to $25 million per person, reducing revenue by about $30 billion a year and letting more estates, including farms and businesses, pass to heirs untaxed.", mirror_of: tax_estate_exempt_lower}
- {id: tax_corp_rate_cut, topic: taxes, lean: right, text: "Lowers the corporate income tax rate from 21 to 17 percent, reducing revenue by about $70 billion a year and raising after-tax profits available for wages, investment and shareholder payouts."}
- {id: tax_corp_rate_raise, topic: taxes, lean: left, text: "Raises the corporate income tax rate from 21 to 25 percent, adding about $70 billion a year in revenue and lowering after-tax profits available for wages, investment and shareholder payouts.", mirror_of: tax_corp_rate_cut}
- {id: tax_gains_top_earners, topic: taxes, lean: left, text: "Taxes long-term capital gains at ordinary income rates for households earning above $2 million, raising about $25 billion a year and lowering those households' after-tax returns on investment."}
- {id: tax_net_worth, topic: taxes, lean: left, text: "Imposes a 1.5 percent annual tax on household net worth above $75 million, raising about $150 billion a year and requiring yearly valuation of private businesses and other hard-to-price assets."}
- {id: tax_child_credit_refund, topic: taxes, lean: left, text: "Makes the child tax credit fully refundable at $2,500 per child, costing about $100 billion a year and paying the full amount to parents with no earned income."}
- {id: tax_buyback_excise, topic: taxes, lean: left, text: "Raises the excise tax on corporate stock buybacks to 5 percent, adding about $20 billion a year in revenue and lowering shareholders' returns from buybacks."}
- {id: tax_two_bracket, topic: taxes, lean: right, text: "Replaces the seven income tax brackets with two rates of 15 and 25 percent, reducing revenue by about $200 billion a year, cutting top rates and raising rates for filers now in the 10 and 12 percent brackets."}
- {id: tax_full_expensing, topic: taxes, lean: right, text: "Lets businesses deduct the full cost of equipment and buildings in the first year, costing about $40 billion a year, with the largest deductions going to capital-heavy firms."}
- {id: tax_enforcement_cut, topic: taxes, lean: right, text: "Cuts the federal tax agency's enforcement budget by 20 percent, saving about $2 billion a year, reducing audits of households and businesses and lowering collections by about $5 billion a year."}
- {id: tax_universal_savings, topic: taxes, lean: right, text: "Creates savings accounts allowing $8,000 a year in after-tax contributions with tax-free growth, no restrictions on use and no income limit, costing about $15 billion a year."}
- {id: tax_state_local_deduction, topic: taxes, lean: mixed, text: "Replaces the dollar cap on deducting state and local taxes with a limit of 8 percent of income for all filers, costing about $60 billion a year, with the largest deductions in high-tax states."}
- {id: tax_fund_manager_income, topic: taxes, lean: mixed, text: "Taxes investment fund managers' performance fees as ordinary income rather than capital gains, raising about $2 billion a year and raising those managers' tax bills."}
- {id: tax_mortgage_deduction_phaseout, topic: taxes, lean: mixed, text: "Phases out the mortgage interest deduction over 15 years and uses the revenue to lower income tax rates, raising after-tax housing costs for homeowners with mortgages."}

# healthcare
- {id: hc_drug_negotiation_expand, topic: healthcare, lean: left, text: "Expands Medicare price negotiation to the 100 highest-spending drugs, saving about $25 billion a year and reducing the revenue drug makers can spend on research."}
- {id: hc_drug_negotiation_limit, topic: healthcare, lean: right, text: "Limits Medicare price negotiation to the 10 highest-spending drugs, raising Medicare spending by about $25 billion a year and raising the revenue drug makers can spend on research.", mirror_of: hc_drug_negotiation_expand}
- {id: hc_federal_plan_exchange, topic: healthcare, lean: left, text: "Adds a federally run health plan to the individual insurance exchanges, paying providers 120 percent of Medicare rates, with that plan competing against private insurers and paying hospitals less than most private plans."}
- {id: hc_medicaid_match, topic: healthcare, lean: left, text: "Raises the federal Medicaid match to 95 percent for states covering adults up to 150 percent of the poverty line, costing about $30 billion a year and covering about 3 million more people."}
- {id: hc_premium_credit_extend, topic: healthcare, lean: left, text: "Extends exchange premium tax credits to households between 400 and 600 percent of the poverty line, capping premiums at 9 percent of income, costing about $25 billion a year and adding about 2 million enrollees."}
- {id: hc_nurse_ratios, topic: healthcare, lean: left, text: "Sets minimum nurse-to-patient ratios in hospitals that accept Medicare, requiring about 150,000 more nurses and raising staffing costs for hospitals of all sizes."}
- {id: hc_medicare_dental, topic: healthcare, lean: left, text: "Adds dental and vision coverage to Medicare, financed by a $12 monthly premium increase for all enrollees, including those who do not use the new benefits."}
- {id: hc_medicaid_work_hours, topic: healthcare, lean: right, text: "Requires states to suspend Medicaid for nondisabled adults under 50 who report under 60 monthly hours of work, study or volunteering, checked quarterly, saving about $30 billion a year and ending coverage for about 3 million people."}
- {id: hc_savings_account_limits, topic: healthcare, lean: right, text: "Doubles contribution limits for health savings accounts and allows their use for premiums, costing about $8 billion a year, with no income limit and access only for people on high-deductible plans."}
- {id: hc_medicaid_per_person, topic: healthcare, lean: right, text: "Converts federal Medicaid funding to fixed per-person allotments growing with inflation, saving about $70 billion a year, removing some federal program rules and leaving states responsible for cost growth above that rate."}
- {id: hc_interstate_plans, topic: healthcare, lean: right, text: "Allows insurers licensed in one state to sell individual plans in any state, exempting those plans from other states' coverage requirements."}
- {id: hc_malpractice_cap, topic: healthcare, lean: right, text: "Caps noneconomic damages in medical malpractice suits at $300,000 nationwide, limiting liability for doctors and their insurers and limiting awards to injured patients."}
- {id: hc_drug_import, topic: healthcare, lean: mixed, text: "Allows pharmacies to import prescription drugs from Canada and Western Europe, giving them access to foreign prices and placing those supply chains outside U.S. regulators' direct oversight."}
- {id: hc_site_payment_parity, topic: healthcare, lean: mixed, text: "Requires Medicare to pay the same rate for outpatient services at hospital-owned clinics and physician offices, saving about $15 billion a year and reducing Medicare revenue for hospitals."}
- {id: hc_living_donor_credit, topic: healthcare, lean: mixed, text: "Creates a $10,000 refundable tax credit for living organ donors, costing about $200 million a year and adding a direct financial payment to the decision to donate."}

# technology
- {id: tech_ai_audit_exempt, topic: technology, lean: right, text: "Bars federal agencies for ten years from requiring safety audits of large AI models before release, removing about six months and $5 million per model from development and leaving pre-release safety testing voluntary."}
- {id: tech_ai_audit_require, topic: technology, lean: left, text: "Requires developers of large AI models to pass independent safety audits before release, adding about six months and $5 million per model and making pre-release safety testing mandatory.", mirror_of: tech_ai_audit_exempt}
- {id: tech_data_opt_in, topic: technology, lean: left, text: "Requires companies to get opt-in consent before selling personal data, with penalties up to 4 percent of revenue, raising compliance costs and limiting data sales that fund free ad-supported services."}
- {id: tech_traffic_equal, topic: technology, lean: left, text: "Bars broadband providers from blocking, slowing or charging extra for specific lawful websites, preventing paid priority and limiting providers' ability to manage traffic or sell premium tiers."}
- {id: tech_hiring_software_audit, topic: technology, lean: left, text: "Requires employers using automated hiring software to pass annual bias audits and publish the results, at about $20,000 per system, with no exemption for smaller firms."}
- {id: tech_platform_self_preference, topic: technology, lean: mixed, text: "Bars online marketplaces and app stores with over 80 million U.S. users from ranking their own products above rivals' products, removing that advantage and ending some built-in features on those services."}
- {id: tech_broadband_subsidy, topic: technology, lean: left, text: "Provides a $30 monthly broadband subsidy to households under 200 percent of the poverty line, costing about $6 billion a year and funded by a 3 percent fee on phone and internet bills."}
- {id: tech_platform_viewpoint, topic: technology, lean: right, text: "Removes social media platforms' liability shield for user posts if they remove lawful content based on viewpoint, requiring written explanations for removals and limiting moderation of offensive or misleading posts."}
- {id: tech_adult_site_id, topic: technology, lean: right, text: "Requires websites with substantial sexual content to verify users' ages with government ID, blocking users under 18 and requiring adult users to give identity data to those sites."}
- {id: tech_token_exemption, topic: technology, lean: right, text: "Exempts digital tokens raising under $40 million from securities registration, lowering issuers' costs by about $1 million per offering and removing disclosures available to retail investors."}
- {id: tech_contractor_china_gear, topic: technology, lean: mixed, text: "Bars federal contractors from buying network equipment, drones or software from firms based in China, raising procurement costs by about $3 billion a year and removing those suppliers from federal supply chains."}
- {id: tech_drone_waivers, topic: technology, lean: mixed, text: "Allows commercial drones to fly beyond the operator's line of sight without individual waivers, removing case-by-case review for delivery and inspection services, including flights over populated areas."}
- {id: tech_repair_access, topic: technology, lean: mixed, text: "Requires makers of phones, tractors and medical devices to sell parts, tools and manuals to independent repair shops, ending those makers' control of repairs and exposing proprietary designs to outside shops."}
- {id: tech_face_recognition_warrant, topic: technology, lean: mixed, text: "Bars federal law enforcement from using facial recognition without a warrant, limiting searches of people not suspected of crimes and adding a court step to investigations."}
- {id: tech_message_decrypt, topic: technology, lean: mixed, text: "Requires messaging apps to be able to provide decrypted messages under a court order, giving investigators access and barring apps from offering encryption they cannot open themselves."}

# social_services
- {id: ss_food_aid_expand, topic: social_services, lean: left, text: "Raises federal food assistance benefits by 15 percent and removes time limits for adults without children, costing about $20 billion a year and adding about 4 million recipients."}
- {id: ss_food_aid_reduce, topic: social_services, lean: right, text: "Lowers federal food assistance benefits by 15 percent and extends time limits to adults up to age 64, saving about $20 billion a year and removing about 4 million recipients.", mirror_of: ss_food_aid_expand}
- {id: ss_paid_leave, topic: social_services, lean: left, text: "Creates 10 weeks of federal paid family and medical leave, funded by a 0.5 percent payroll tax split between workers and employers, and requires employers of all sizes to hold those jobs open."}
- {id: ss_child_care_cap, topic: social_services, lean: left, text: "Caps child care costs at 9 percent of income for households under $120,000, costing about $40 billion a year and adding licensing requirements for home-based providers."}
- {id: ss_voucher_guarantee, topic: social_services, lean: left, text: "Guarantees federal rental vouchers to all households below 30 percent of area median income, costing about $45 billion a year, with no waiting list and no fixed limit on total spending."}
- {id: ss_disability_asset_limit, topic: social_services, lean: mixed, text: "Raises the asset limit for federal disability income benefits from $2,000 to $7,500, letting recipients keep more savings and raising program costs by about $2 billion a year."}
- {id: ss_payroll_tax_above_cap, topic: social_services, lean: left, text: "Applies the Social Security payroll tax to wages above $250,000, adding about 20 years to trust fund solvency and raising taxes on about 5 million top earners and their employers."}
- {id: ss_retirement_age_69, topic: social_services, lean: right, text: "Raises the Social Security full retirement age to 69 over 20 years, adding about 20 years to trust fund solvency and reducing lifetime benefits by about 13 percent for younger workers."}
- {id: ss_housing_time_limit, topic: social_services, lean: right, text: "Limits federal housing assistance to five years for non-elderly, nondisabled adults, saving about $3 billion a year, opening those vouchers to households on waiting lists and ending aid for recipients at the limit."}
- {id: ss_religious_providers, topic: social_services, lean: right, text: "Lets religious charities compete for federal social service contracts while keeping religious hiring preferences, adding them to the provider pool and allowing federally funded jobs to be limited by faith."}
- {id: ss_benefit_recheck, topic: social_services, lean: right, text: "Requires identity and income checks every six months for federal benefit programs, adding $1 billion a year in administrative costs and ending benefits for recipients who do not complete a check, including eligible ones."}
- {id: ss_marriage_benefit_rule, topic: social_services, lean: mixed, text: "Removes the reduction in disability and low-income benefits when recipients marry, costing about $4 billion a year and paying higher combined benefits to some couples than to similar households."}
- {id: ss_foster_care_age, topic: social_services, lean: mixed, text: "Extends federal foster care payments to age 23 for youth who work or attend school, costing about $1 billion a year and leaving out those who do not meet the requirement."}
- {id: ss_retiree_cola_income, topic: social_services, lean: mixed, text: "Reduces Social Security cost-of-living increases for retirees with incomes above $150,000, saving about $20 billion a year and ending the rule that all retirees receive the same percentage adjustment."}

# education
- {id: edu_loan_cancel, topic: education, lean: left, text: "Cancels up to $15,000 in federal student loans for borrowers earning under $100,000, costing about $300 billion once, with no relief for those who already repaid or never attended college."}
- {id: edu_loan_full_repay, topic: education, lean: right, text: "Ends forgiveness of federal student loans after 20 years of income-based payments, saving about $30 billion a year and requiring those borrowers to keep paying until their balances are cleared."}
- {id: edu_community_college, topic: education, lean: left, text: "Eliminates tuition at public community colleges, with the federal government paying 60 percent and states 40 percent, costing about $9 billion a year and providing no matching aid for private or four-year colleges."}
- {id: edu_high_poverty_funding, topic: education, lean: left, text: "Doubles federal funding for high-poverty school districts, costing about $18 billion a year, and requires states to maintain their own spending, limiting state budget flexibility during downturns."}
- {id: edu_preschool_match, topic: education, lean: left, text: "Funds preschool for all 4-year-olds with a 60 percent federal match, costing about $25 billion a year and directing the money to public programs rather than private and faith-based providers."}
- {id: edu_forprofit_debt_test, topic: education, lean: left, text: "Bars federal student aid at for-profit college programs where graduates' debt exceeds 10 percent of earnings, ending aid at about 300 programs and removing them as federally funded training options."}
- {id: edu_scholarship_credit, topic: education, lean: right, text: "Creates a federal tax credit for donations to private school scholarship funds, capped at $3,000 per donor, costing about $10 billion a year and providing no offset for public schools that lose students."}
- {id: edu_course_materials_online, topic: education, lean: right, text: "Requires federally funded public schools to post all course materials online and let parents opt children out of any lesson, adding about $400 million a year in administrative costs and requiring teachers to plan around opt-outs."}
- {id: edu_endowment_tax, topic: education, lean: right, text: "Raises the tax on large private college endowments to 10 percent, adding about $2 billion a year in revenue and reducing funds those colleges can use for financial aid and research."}
- {id: edu_test_growth_funding, topic: education, lean: mixed, text: "Ties 10 percent of federal K-12 funding to student test-score growth, moving about $2 billion a year from districts that fall short to improving ones, with no adjustment for student turnover."}
- {id: edu_program_block_grant, topic: education, lean: right, text: "Consolidates 30 federal K-12 programs into one block grant to states, cutting federal administrative funding by about $500 million a year and ending targeted spending rules for low-income and disabled students."}
- {id: edu_phone_ban, topic: education, lean: mixed, text: "Requires federally funded schools to ban student phones during the school day, with $200 million for storage and enforcement, and removes students' direct phone contact with parents during those hours."}
- {id: edu_short_program_grants, topic: education, lean: mixed, text: "Allows federal need-based college grants to pay for job training programs of 8 to 15 weeks, extending aid to trades programs and spreading limited funds to programs with no minimum completion rate."}
- {id: edu_state_accreditors, topic: education, lean: mixed, text: "Lets states approve new college accreditors for federal student aid purposes, opening aid to new types of institutions and removing federal vetting of those accreditors for about $1 billion a year in aid."}

# immigration
- {id: imm_status_bar, topic: immigration, lean: right, text: "Bars people living in the country without authorization for over 10 years from any legal status and adds $10 billion a year for their removal, applying to about 8 million residents, including farm and construction workers."}
- {id: imm_status_path, topic: immigration, lean: left, text: "Offers legal status to people living in the country without authorization for over 10 years, after a $5,000 fine and background check, applying to about 8 million residents and costing about $10 billion a year in benefits.", mirror_of: imm_status_bar}
- {id: imm_refugee_floor, topic: immigration, lean: left, text: "Sets minimum annual refugee admissions at 100,000, costing about $2 billion a year and requiring more resettlement capacity in receiving communities."}
- {id: imm_refugee_ceiling, topic: immigration, lean: right, text: "Sets maximum annual refugee admissions at 25,000, saving about $2 billion a year and keeping applicants above that limit waiting abroad, including those already screened.", mirror_of: imm_refugee_floor}
- {id: imm_child_arrivals_residence, topic: immigration, lean: left, text: "Grants renewable ten-year residence to people brought without authorization before age 12 who have lived here 15 years and pay a $2,000 fee, covering about 2 million people and costing about $3 billion a year."}
- {id: imm_court_lawyers, topic: immigration, lean: left, text: "Provides government-funded lawyers to asylum applicants in immigration court, costing about $1 billion a year and adding contested claims and attorney time to court dockets."}
- {id: imm_detention_limit, topic: immigration, lean: left, text: "Limits immigration detention to 90 days unless a judge orders more, saving about $1 billion a year and requiring release of more people before their hearings."}
- {id: imm_visa_job_change, topic: immigration, lean: mixed, text: "Lets temporary skilled-visa holders change employers without losing status, strengthening their bargaining position with employers and adding recruitment costs for sponsoring firms that lose staff."}
- {id: imm_work_verification, topic: immigration, lean: right, text: "Requires all employers to confirm work eligibility electronically within two years, costing small businesses about $1,000 each and requiring further checks for authorized workers whose records do not match."}
- {id: imm_asylum_wait_abroad, topic: immigration, lean: right, text: "Requires asylum applicants to apply at official ports of entry and wait outside the country during processing, adding about $1 billion a year in border processing costs and keeping applicants abroad for months."}
- {id: imm_family_visa_limit, topic: immigration, lean: right, text: "Ends the sibling and adult-child family green card categories over ten years, moving half of those visas to employment categories, cutting admissions by about 125,000 a year and leaving those relatives with no family-based path."}
- {id: imm_border_barriers, topic: immigration, lean: right, text: "Spends $15 billion over five years on physical barriers and surveillance along the southern border, including purchases of private land along the route."}
- {id: imm_visa_highest_wage, topic: immigration, lean: mixed, text: "Awards skilled-worker visas to the highest-paying employers first rather than by lottery, raising the pay needed to win a visa and placing lower-paying employers, including startups and nonprofits, last in line."}
- {id: imm_stem_graduate_residence, topic: immigration, lean: mixed, text: "Grants green cards to foreign graduates of U.S. advanced science and engineering programs, adding about 50,000 residents a year who compete with U.S.-born engineers and researchers for jobs."}

# criminal_justice
- {id: cj_drug_min_raise, topic: criminal_justice, lean: right, text: "Adds five years to federal mandatory minimum sentences for drug trafficking, adding about 20,000 prisoners and $1 billion a year in costs and leaving judges less room to set sentence length."}
- {id: cj_drug_min_end, topic: criminal_justice, lean: left, text: "Ends federal mandatory minimum sentences for drug trafficking, lowering the prison population by about 20,000, saving $1 billion a year and leaving sentence length to individual judges.", mirror_of: cj_drug_min_raise}
- {id: cj_bail_limit, topic: criminal_justice, lean: left, text: "Bars cash bail for federal nonviolent misdemeanors and lower-level felonies, cutting pretrial detention costs by about $200 million a year and releasing those defendants with no financial stake in returning to court."}
- {id: cj_officer_lawsuits, topic: criminal_justice, lean: left, text: "Lets people sue police officers in federal court without showing the violated right was clearly established, removing that defense and raising local liability costs by about $500 million a year."}
- {id: cj_body_camera_database, topic: criminal_justice, lean: left, text: "Requires police departments receiving federal funds to use body cameras and report to a national use-of-force database, costing about $400 million a year and recording bystanders and private spaces on footage."}
- {id: cj_record_sealing, topic: criminal_justice, lean: mixed, text: "Automatically seals federal nonviolent conviction records after seven years without a new offense, removing that history from job and housing checks and blocking employers' and landlords' access to it."}
- {id: cj_death_penalty_end, topic: criminal_justice, lean: left, text: "Abolishes the federal death penalty and converts existing sentences to life without parole, saving about $100 million a year and removing that sentencing option for all federal crimes."}
- {id: cj_death_penalty_expand, topic: criminal_justice, lean: right, text: "Extends federal death penalty eligibility to fatal fentanyl trafficking, adding about $100 million a year in trial and appeal costs and adding a capital charge prosecutors can bring in those cases."}
- {id: cj_police_hiring_grants, topic: criminal_justice, lean: right, text: "Adds $2 billion a year to hire 15,000 local police officers, funded by cuts to federal grants for community violence-intervention and reentry programs."}
- {id: cj_juvenile_adult_prosecution, topic: criminal_justice, lean: right, text: "Allows federal prosecution of 15-year-olds as adults for violent felonies, adding about $50 million a year in prison costs and exposing about 200 more minors a year to adult sentences and adult prison."}
- {id: cj_repeat_pretrial_hold, topic: criminal_justice, lean: right, text: "Presumes pretrial detention for federal defendants with two prior violent felonies, adding about $150 million a year in jail costs and holding those defendants before any verdict."}
- {id: cj_forfeiture_conviction, topic: criminal_justice, lean: mixed, text: "Requires a criminal conviction before the government can keep seized property worth under $50,000, ending those seizures from people never convicted and lowering law enforcement revenue by about $400 million a year."}
- {id: cj_marijuana_deschedule, topic: criminal_justice, lean: mixed, text: "Removes marijuana from federal drug schedules, leaves regulation to states and adds a 5 percent federal excise tax, raising about $2 billion a year and leaving different rules across state lines."}
- {id: cj_older_prisoner_release, topic: criminal_justice, lean: mixed, text: "Lets federal prisoners over 60 who have served two-thirds of their sentence petition for home confinement, saving about $300 million a year and covering people convicted of any crime, including violent ones."}

# guns
- {id: gun_private_check_require, topic: guns, lean: left, text: "Requires background checks through licensed dealers on all private gun sales for money, exempting gifts, adding a fee of about $35 and delays of up to several days."}
- {id: gun_private_check_bar, topic: guns, lean: right, text: "Bars any federal requirement for background checks on private gun sales, avoiding about $35 in fees and delays of up to several days and leaving those sales outside the check system.", mirror_of: gun_private_check_require}
- {id: gun_wait_bar, topic: guns, lean: right, text: "Bars states from imposing waiting periods on handgun purchases, overriding laws in about ten states and letting all buyers who pass a background check take possession immediately."}
- {id: gun_wait_require, topic: guns, lean: left, text: "Requires a five-day waiting period for all handgun purchases nationwide, adding that wait in about 40 states with none and making all buyers who pass a background check wait before taking possession.", mirror_of: gun_wait_bar}
- {id: gun_rifle_feature_ban, topic: guns, lean: left, text: "Bans sale of new semi-automatic rifles with detachable magazines and pistol grips while allowing existing ones to be kept, removing those new models from the retail market for all buyers."}
- {id: gun_rifle_age_21, topic: guns, lean: left, text: "Raises the minimum age to buy semi-automatic rifles from 18 to 21, barring those purchases by about 12 million adults aged 18 to 20."}
- {id: gun_court_removal, topic: guns, lean: left, text: "Funds state court orders temporarily removing guns from people found dangerous, for up to one year with a hearing within 14 days, costing $250 million and allowing removal without a criminal conviction."}
- {id: gun_maker_liability, topic: guns, lean: left, text: "Allows civil lawsuits against gun makers and dealers for negligent sales or marketing, ending their current shield from those suits and raising industry insurance costs by about $200 million a year."}
- {id: gun_carry_reciprocity, topic: guns, lean: right, text: "Requires every state to honor out-of-state concealed-carry permits for visits of up to 30 days, covering about 20 million permit holders and allowing carry in states with stricter permit standards."}
- {id: gun_suppressor_registration, topic: guns, lean: right, text: "Removes firearm suppressors from federal registration while keeping dealer background checks, ending the federal approval wait for buyers and removing federal records of who owns them."}
- {id: gun_school_staff_arming, topic: guns, lean: right, text: "Lets school districts use federal funds to train and arm volunteer staff, moving $200 million a year from school safety grants and placing guns with staff in participating schools."}
- {id: gun_dealer_inspections, topic: guns, lean: right, text: "Limits federal compliance inspections of licensed gun dealers to one every three years, reducing inspections for about 50,000 dealers and leaving record-keeping unchecked between those visits."}
- {id: gun_voluntary_self_list, topic: guns, lean: mixed, text: "Lets people add their own names to the background-check denial list for a year, blocking their own gun purchases during that time, costing $20 million a year and creating a federal record of that choice."}
- {id: gun_nonviolent_restoration, topic: guns, lean: mixed, text: "Lets people with nonviolent felony convictions petition for restored firearm rights after 10 clean years, adding about $100 million a year in reviews and returning gun access to those whose petitions succeed."}

# environment_energy
- {id: env_carbon_fee, topic: environment_energy, lean: left, text: "Imposes a $25-per-ton fee on carbon emissions, rising 5 percent a year with rebates to households, raising about $100 billion a year and adding about 22 cents to a gallon of gasoline."}
- {id: env_carbon_fee_bar, topic: environment_energy, lean: right, text: "Bars any federal fee on carbon emissions for ten years, avoiding about 22 cents a gallon in added gasoline costs and giving up about $100 billion a year in possible revenue and rebates.", mirror_of: env_carbon_fee}
- {id: env_ev_fee, topic: environment_energy, lean: right, text: "Bars any federal electric vehicle purchase tax credit through 2035 and adds a $150 annual federal fee on those vehicles, raising about $3 billion a year and adding to owners' costs."}
- {id: env_ev_credit, topic: environment_energy, lean: left, text: "Creates a $5,000 federal electric vehicle purchase tax credit through 2035 with no annual federal fee on those vehicles, costing about $12 billion a year, with no income limit for buyers.", mirror_of: env_ev_fee}
- {id: env_lease_pause, topic: environment_energy, lean: left, text: "Stops new oil and gas leases on federal lands for ten years, costing about $4 billion a year in royalties shared with states and reducing oil and gas production on those lands."}
- {id: env_lease_required, topic: environment_energy, lean: right, text: "Requires quarterly oil and gas lease sales on federal lands for ten years, adding about $4 billion a year in royalties shared with states and raising oil and gas production on those lands.", mirror_of: env_lease_pause}
- {id: env_clean_power_standard, topic: environment_energy, lean: left, text: "Requires utilities to get 60 percent of electricity from zero-carbon sources by 2040, with utilities passing compliance costs on to household bills during the transition."}
- {id: env_methane_inspections, topic: environment_energy, lean: left, text: "Requires oil and gas producers to find and repair methane leaks through quarterly inspections, costing about $1.5 billion a year, with no exemption for small wells."}
- {id: env_review_time_limit, topic: environment_energy, lean: mixed, text: "Limits federal environmental reviews for energy projects to 18 months and 200 pages, covering pipelines and power lines alike and reducing time for public comment and impact analysis."}
- {id: env_wetland_scope, topic: environment_energy, lean: right, text: "Narrows federal water rules to permanent waterways and adjacent wetlands, removing federal permit review for about 20 million acres of seasonal streams and isolated wetlands."}
- {id: env_appliance_payback, topic: environment_energy, lean: right, text: "Bars new federal appliance efficiency standards unless the extra purchase cost is repaid within three years, keeping upfront prices lower and ruling out standards that save more energy over a longer period."}
- {id: env_reactor_licensing, topic: environment_energy, lean: mixed, text: "Shortens nuclear reactor licensing to 18 months and adds $3 billion for waste storage, speeding approval of new reactors and reducing time for safety review and local objections."}
- {id: env_ethanol_phaseout, topic: environment_energy, lean: mixed, text: "Phases out the federal requirement to blend corn ethanol into gasoline over five years, removing a guaranteed market for corn growers and reducing farm income in the Midwest by about $3 billion a year."}
- {id: env_transmission_siting, topic: environment_energy, lean: mixed, text: "Gives federal regulators final authority to approve interstate power lines over state objections, setting a two-year limit on approvals and removing local control over routes through private land."}

# international_policy
- {id: intl_aid_cut, topic: international_policy, lean: right, text: "Cuts the foreign aid budget by $10 billion a year and shifts the funds to the defense budget, ending some health programs in about 30 countries."}
- {id: intl_aid_raise, topic: international_policy, lean: left, text: "Raises the foreign aid budget by $10 billion a year for health and development programs in about 30 countries, funded by cuts to the defense budget.", mirror_of: intl_aid_cut}
- {id: intl_defense_cut, topic: international_policy, lean: left, text: "Cuts the defense budget by 5 percent, about $40 billion a year, cancelling some weapons programs and readiness funding and shifting the money to domestic programs and deficit reduction."}
- {id: intl_defense_raise, topic: international_policy, lean: right, text: "Raises the defense budget by 5 percent, about $40 billion a year, funding new weapons programs and readiness through cuts to domestic programs and a larger deficit.", mirror_of: intl_defense_cut}
- {id: intl_climate_fund, topic: international_policy, lean: left, text: "Contributes $3 billion a year to an international fund for climate adaptation in low-income countries, paid from federal energy research accounts."}
- {id: intl_arms_rights_condition, topic: international_policy, lean: left, text: "Requires suspension of arms sales to any country the federal government finds has committed serious human rights violations, ending about $5 billion a year in sales to those security partners."}
- {id: intl_cuba_embargo_end, topic: international_policy, lean: left, text: "Ends the trade embargo on Cuba, opening about $1 billion a year in export markets and giving up the main U.S. economic leverage over that government."}
- {id: intl_trade_labor_terms, topic: international_policy, lean: left, text: "Bars new trade agreements that lack enforceable labor and environmental standards, adding those conditions to future deals and blocking deals with countries that refuse them."}
- {id: intl_ally_troop_spending, topic: international_policy, lean: right, text: "Withdraws U.S. troops within three years from allies spending under 2.5 percent of economic output on defense, saving about $5 billion a year and reducing U.S. presence in those regions."}
- {id: intl_china_investment, topic: international_policy, lean: mixed, text: "Bars U.S. investment in Chinese AI and semiconductor companies, limiting capital flows to those firms and costing U.S. investors about $3 billion a year in returns."}
- {id: intl_dues_cap, topic: international_policy, lean: right, text: "Caps U.S. payments to any international organization at 15 percent of its budget, saving about $1 billion a year and reducing U.S. voting influence in some of those bodies."}
- {id: intl_force_authorization_expiry, topic: international_policy, lean: mixed, text: "Makes every congressional authorization for military force expire after five years unless renewed, increasing legislative oversight and limiting a president's flexibility in long-running operations."}
- {id: intl_taiwan_military_aid, topic: international_policy, lean: mixed, text: "Provides $2 billion a year in direct military aid to Taiwan for five years, adding to its defense funding and deepening U.S. military ties over China's objections."}
- {id: intl_tariff_approval, topic: international_policy, lean: mixed, text: "Requires congressional approval within 120 days for any presidential tariff above 10 percent, increasing legislative control of trade and limiting a president's leverage in negotiations."}

# government_elections
- {id: gov_mail_excuse, topic: government_elections, lean: right, text: "Requires states to limit mail ballots in federal elections to voters with a documented reason, overriding no-excuse rules in states that have them and requiring other voters to vote in person."}
- {id: gov_mail_universal, topic: government_elections, lean: left, text: "Requires states to offer mail ballots to all voters in federal elections without a stated reason, overriding excuse requirements in states that have them and adding mail ballots for election offices to count.", mirror_of: gov_mail_excuse}
- {id: gov_auto_registration, topic: government_elections, lean: left, text: "Automatically registers eligible citizens when they get a state ID unless they decline, costing about $600 million to set up, adding about 10 million voters and relying on state ID records to establish eligibility."}
- {id: gov_dc_statehood, topic: government_elections, lean: left, text: "Admits most of the District of Columbia as a state with one House seat and two Senate seats, giving about 700,000 residents voting members of Congress and shrinking the federal district to a small area."}
- {id: gov_small_donor_match, topic: government_elections, lean: left, text: "Provides a 4-to-1 federal match for small campaign donations to House candidates, costing about $1 billion per election cycle in federal funds."}
- {id: gov_release_voting, topic: government_elections, lean: left, text: "Restores voting rights in federal elections for people with felony convictions upon release from prison, covering about 4 million people, including those still on parole, and overriding rules in about 20 states."}
- {id: gov_proof_citizenship, topic: government_elections, lean: right, text: "Requires states to check federal-election registrants against federal citizenship records and reject those unmatched unless they show a passport or birth certificate, with no exception for eligible citizens without ready access to them."}
- {id: gov_photo_id, topic: government_elections, lean: right, text: "Requires photo ID to vote in federal elections, with free IDs costing about $500 million a year, and rejects regular ballots from voters who arrive without one."}
- {id: gov_senior_staff_at_will, topic: government_elections, lean: right, text: "Makes federal employees at the two highest career grades, about 30,000 people, removable at will after 60 days' notice, ending their civil-service appeals and allowing removal for any reason, including political ones."}
- {id: gov_agency_relocation, topic: government_elections, lean: right, text: "Moves 30 percent of federal agency headquarters staff out of the capital region within five years, costing about $3 billion, spreading those jobs nationally and requiring staff to relocate or leave."}
- {id: gov_major_rule_approval, topic: government_elections, lean: right, text: "Requires both chambers of Congress to approve federal rules costing over $200 million a year within 90 days, adding that vote to the rulemaking process and blocking any rule not approved, including safety standards."}
- {id: gov_member_stock_ban, topic: government_elections, lean: mixed, text: "Bars members of Congress and their spouses from trading individual stocks, requiring diversified funds or blind trusts and requiring members with large holdings to restructure them."}
- {id: gov_ranked_primaries, topic: government_elections, lean: mixed, text: "Requires ranked-choice voting in House primaries, ending wins by small pluralities, costing about $100 million in new equipment and voter education and changing how voters mark ballots."}
- {id: gov_term_limits_amendment, topic: government_elections, lean: mixed, text: "Proposes a constitutional amendment limiting total service in Congress to 16 years across both chambers, adding turnover and removing members with longer experience."}

# social_issues
- {id: soc_abortion_week_14, topic: social_issues, lean: right, text: "Sets a national limit on abortion at 14 weeks of pregnancy, with exceptions for rape, incest and the woman's life, overriding later limits in about 20 states."}
- {id: soc_abortion_week_20, topic: social_issues, lean: left, text: "Bars states from limiting abortion before 20 weeks of pregnancy, leaving later limits to states, overriding earlier limits in about 20 states.", mirror_of: soc_abortion_week_14}
- {id: soc_sports_inclusion, topic: social_issues, lean: left, text: "Bars federally funded schools from excluding transgender girls from girls' sports teams, overriding about 25 state laws and ending sex-at-birth eligibility rules for those teams."}
- {id: soc_sports_restrict, topic: social_issues, lean: right, text: "Bars transgender girls from girls' sports teams at federally funded schools, overriding policies in about 25 states and requiring sex-at-birth eligibility rules for those teams.", mirror_of: soc_sports_inclusion}
- {id: soc_orientation_discrimination, topic: social_issues, lean: left, text: "Adds sexual orientation and gender identity to federal anti-discrimination law for housing, lending and public accommodations, with narrow religious exemptions, allowing lawsuits on those grounds against small businesses."}
- {id: soc_contraceptive_coverage, topic: social_issues, lean: left, text: "Requires insurers to cover contraceptives with no cost sharing and no exemption for religious employers, adding about $1 billion a year in premiums paid by employers and enrollees."}
- {id: soc_pay_reporting, topic: social_issues, lean: left, text: "Requires employers with over 100 workers to report pay by sex and race each year, costing about $4,000 per firm and giving regulators aggregate data they can use in enforcement."}
- {id: soc_housing_harm_commission, topic: social_issues, lean: left, text: "Creates a $50 million federal commission to recommend compensation for families denied federally backed home loans under 20th-century racial lending rules, with any later payments requiring separate funding of unspecified size."}
- {id: soc_ceremony_service_exemption, topic: social_issues, lean: right, text: "Exempts businesses with under 25 employees and religious objections from federal anti-discrimination rules on wedding services, letting those owners decline such work and requiring some same-sex couples to find other vendors."}
- {id: soc_english_official, topic: social_issues, lean: right, text: "Makes English the official language of the federal government and ends most translated forms, saving about $500 million a year and removing those forms for about 25 million residents with limited English."}
- {id: soc_minor_hormones_bar, topic: social_issues, lean: right, text: "Bars federally funded hospitals from providing puberty blockers or hormone treatment for gender transition to anyone under 18, overriding some parents' and doctors' decisions and ending that care there for about 5,000 minors."}
- {id: soc_teen_social_accounts, topic: social_issues, lean: mixed, text: "Bars users under 16 from social media accounts, enforced by age checks on all users, removing those teens' accounts and requiring adults to submit identification to use those sites."}
- {id: soc_betting_ads, topic: social_issues, lean: mixed, text: "Bans advertising of online sports betting during broadcasts and on streaming services, removing those ads for all viewers and lowering broadcasters' revenue by about $1 billion a year."}
- {id: soc_permanent_daylight, topic: social_issues, lean: mixed, text: "Ends twice-yearly clock changes by keeping all states on summer time year-round, moving winter sunrise and sunset an hour later nationwide."}

# infrastructure
- {id: inf_wage_exempt, topic: infrastructure, lean: right, text: "Exempts federally funded water and broadband projects from locally prevailing wage rules, lowering labor costs on those projects and reducing construction workers' pay on those jobs."}
- {id: inf_wage_require, topic: infrastructure, lean: left, text: "Requires locally prevailing wages on all federally funded water and broadband projects, raising labor costs on those projects and increasing construction workers' pay on those jobs.", mirror_of: inf_wage_exempt}
- {id: inf_transit_shift, topic: infrastructure, lean: left, text: "Shifts 25 percent of federal highway funds to public transit and rail, moving about $10 billion a year from road repair, with the largest per-person cuts in rural states."}
- {id: inf_highway_shift, topic: infrastructure, lean: right, text: "Shifts 25 percent of federal transit funds to highways, moving about $5 billion a year from bus and rail service, with the largest per-person cuts in large metro areas."}
- {id: inf_lead_lines, topic: infrastructure, lean: left, text: "Requires replacing all lead water lines within ten years with $30 billion in federal funds, with utilities covering remaining costs through water rate increases of about $150 a year for many households."}
- {id: inf_federal_bank, topic: infrastructure, lean: left, text: "Creates a federally capitalized infrastructure bank with $50 billion to lend for public works, leaving taxpayers liable for defaults and shifting some selection decisions away from Congress."}
- {id: inf_passenger_rail, topic: infrastructure, lean: left, text: "Provides $10 billion a year for intercity passenger rail in 10 corridors, requiring fares to cover at least 60 percent of operating costs, with federal funds covering the rest."}
- {id: inf_toll_leases, topic: infrastructure, lean: right, text: "Allows states to add tolls and sign 50-year leases with private operators on federally funded highways, raising about $5 billion a year from tolls paid by drivers."}
- {id: inf_gas_tax_devolve, topic: infrastructure, lean: right, text: "Returns most federal highway programs to states over five years and cuts the federal gas tax from 18 cents to 5 cents, with states choosing whether to replace about $25 billion a year."}
- {id: inf_small_project_review, topic: infrastructure, lean: right, text: "Exempts road and bridge repairs under $50 million from federal environmental review, removing about two years from those projects' schedules and removing analysis of effects on nearby streams and neighborhoods."}
- {id: inf_air_traffic_corporation, topic: infrastructure, lean: right, text: "Moves air traffic control to a nonprofit corporation funded by user fees of about $10 billion a year, separating it from federal budget cycles and ending direct public control over rural airport service."}
- {id: inf_road_mile_fee, topic: infrastructure, lean: mixed, text: "Replaces the federal gas tax with a 2-cent-per-mile road fee on all vehicles, charging electric vehicle owners for road use and requiring mileage tracking of all drivers."}
- {id: inf_domestic_materials, topic: infrastructure, lean: mixed, text: "Removes all cost and availability waivers from domestic-content rules for iron, steel and construction materials in federally funded projects, raising project costs with no exception when domestic supply is short."}
- {id: inf_rural_fiber, topic: infrastructure, lean: mixed, text: "Spends $15 billion on fiber broadband in rural counties, allowing up to $30,000 per home in the most remote areas and providing no funds for wireless options."}
