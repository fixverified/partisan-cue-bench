[project]
name = "partisan-cue-bench"
version = "0.1.0"
description = "Measures whether a language model's vote on a bill changes when only the sponsor's party changes."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "litellm==1.99.0", "openai>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/partisan_cue_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
