[project]
name = "partisan-cue-bench"
version = "0.1.0"
description = "Does an AI model's vote change when only the proposal's party label changes?"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "litellm==1.99.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
partisan-cue-bench = "partisan_cue_bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/partisan_cue_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
